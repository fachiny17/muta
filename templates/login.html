<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <title>Muta — Team login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M7 31V9h5l8 11 8-11h5v22h-5V17l-8 10-8-10v14z' fill='%23167456'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-left"><a class="logo" href="{{ url_for('web.index') }}" aria-label="Muta home"><svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M7 31V9h5l8 11 8-11h5v22h-5V17l-8 10-8-10v14H7Z" fill="currentColor"/><path d="M7 34h26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="logo-text">Muta</span></a><div class="header-copy"><p class="subtitle">Team login</p></div></div>
    <div class="header-right"><nav class="nav" aria-label="Main navigation"><a class="nav-link" href="{{ url_for('web.index') }}">Home</a></nav><button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme" aria-pressed="false" title="Toggle colour theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button></div>
  </header>
  <main class="main-content stack">
    <section class="card login-card">
      <div class="login-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div>
      <p class="eyebrow">03 / Restricted area</p><h1 class="main-title">Team login</h1>
      <p class="subtitle">This area is for the Muta team only. Enter the team password to continue.</p>
      <form method="post" action="{{ url_for('web.login') }}" autocomplete="off">
        <label class="field-label" for="password">Team password</label>
        <input class="field" id="password" type="password" name="password" placeholder="Enter team password" required autocomplete="current-password" autofocus>
        {% if error %}<p class="error-copy" role="alert">{{ error }}</p>{% endif %}
        <button class="btn btn-primary btn-full" type="submit">Log in</button>
      </form>
    </section>
  </main>
</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
