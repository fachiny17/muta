<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muta - Team login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nexlearn.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
  <header class="header">
    <div><span class="logo-text">MUTA</span><p class="subtitle">Team login</p></div>
    <nav class="nav"><a class="nav-link" href="{{ url_for('web.index') }}">Home</a></nav>
  </header>
  <main class="main-content stack">
    <div class="card" style="max-width:420px; margin:0 auto;">
      <h2>Dashboard access</h2>
      <p class="hint">This area is for the Muta team only. Enter the team password.</p>
      <form method="post" action="{{ url_for('web.login') }}" autocomplete="off">
        <input class="field" type="password" name="password" placeholder="Team password" required autofocus>
        {% if error %}<p class="hint" style="color:var(--danger)">{{ error }}</p>{% endif %}
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
    </div>
  </main>
</div>
</body>
</html>
