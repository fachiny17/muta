services:
  - type: web
    name: muta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DASHBOARD_KEY
        generateValue: true
      - key: GATEWAY_KEY
        sync: false
      - key: GATEWAY_URL
        value: https://ladder-rss-warehouse-heel.trycloudflare.com
      - key: DEMO_VIDEO_URL
        value: ""
      - key: DB_PATH
        value: /tmp/sauti.db
      - key: WHATSAPP_ENABLED
        value: "0"
